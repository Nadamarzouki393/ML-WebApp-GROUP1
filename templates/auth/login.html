<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">

    <!-- Static CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='auth/fonts/icomoon/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth/css/owl.carousel.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth/css/style.css') }}">

    <title>Login</title>
  </head>
  <body>
  
  <div class="d-lg-flex half">
    <div class="bg order-1 order-md-2" style="background-image: url('{{ url_for('static', filename='auth/images/ml.jpg') }}')"></div>
    <div class="contents order-2 order-md-1">
      <div class="container">
        <div class="row align-items-center justify-content-center">
          <div class="col-md-7">

            <h3>Login to <strong>AI Teck</strong></h3>
            <p class="mb-4">Entrez vos identifiants pour accéder à votre compte.</p>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-warning" role="alert">
                  {{ messages[0] }}
                </div>
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="post">
              <div class="form-group first">
                <label for="username">Username or Email</label>
                <input 
                  type="text" 
                  class="form-control" 
                  placeholder="your-email@gmail.com" 
                  id="username" 
                  name="username"
                  value="{{ request.form.get('username', '') }}"
                >
              </div>
              <div class="form-group last mb-3">
                <label for="password">Password</label>
                <input 
                  type="password" 
                  class="form-control" 
                  placeholder="Your Password" 
                  id="password" 
                  name="password"
                >
              </div>
              
              <div class="d-flex mb-5 align-items-center">
                <label class="control control--checkbox mb-0">
                  <span class="caption">Remember me</span>
                  <input type="checkbox" name="remember" checked="checked"/>
                  <div class="control__indicator"></div>
                </label>
                <span class="ml-auto"><a href="#" class="forgot-pass">Forgot Password?</a></span> 
              </div>

              <input type="submit" value="Log In" class="btn btn-block btn-primary">

              <div class="text-center mt-3">
                <span>Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></span>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="{{ url_for('static', filename='auth/js/jquery-3.3.1.min.js') }}"></script>
  <script src="{{ url_for('static', filename='auth/js/popper.min.js') }}"></script>
  <script src="{{ url_for('static', filename='auth/js/bootstrap.min.js') }}"></script>
  <script src="{{ url_for('static', filename='auth/js/main.js') }}"></script>
  </body>
</html>
